<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcompañaMente - Inicio</title>
    <style>
        /* Estilos generales para que la página se vea profesional */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        /* Encabezado principal */
        header {
            background-color: #1a5f7a; /* Un azul/verde relajante para salud mental */
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        header p {
            margin: 10px 0 0;
            font-size: 1.2em;
            opacity: 0.9;
        }

        /* Sección del video */
        #presentacion-proyecto {
            text-align: center;
            padding: 50px 20px;
        }

        #presentacion-proyecto h2 {
            color: #1a5f7a;
            margin-bottom: 10px;
        }

        .video-container {
            max-width: 800px;
            margin: 30px auto 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
        }
        
        /* Ajuste para que el video siempre respete el contenedor */
        video {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Encabezado de la página -->
    <header>
        <h1>AcompañaMente</h1>
        <p>Salud Mental y Bienestar para Providencia</p>
    </header>

    <!-- Sección principal con el video de HeyGen -->
    <section id="presentacion-proyecto">
        <h2>Conoce Nuestro Proyecto</h2>
        <p>Descubre cómo el equipo TDI estructuró esta plataforma en la nube para democratizar el acceso a la salud mental.</p>
        
        <!-- Contenedor del video -->
        <div class="video-container">
            <video width="100%" controls preload="metadata">
                <source src="acompanamente.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de videos.
            </video>
        </div>
    </section>

    <!-- Aquí abajo puedes seguir agregando las demás secciones (Chatbot, Centros, etc.) -->

</body>
</html>
